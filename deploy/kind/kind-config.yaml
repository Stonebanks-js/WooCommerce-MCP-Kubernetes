# kind cluster for local development (deploy/scripts/kind-up.sh, `make kind-up`).
#
# * One control-plane node, image pinned by digest (kind v0.33.0's default for Kubernetes 1.37).
# * Host ports 80/443 on 127.0.0.1 are forwarded into the node, where Traefik listens on hostPorts
#   80/443 (installed by kind-up.sh on the node labelled ingress-ready=true). That is what makes
#   http://store.127.0.0.1.nip.io and http://gateway.127.0.0.1.nip.io work from the host.
# * kind's default CNI (kindnet) ships kube-network-policies since kind v0.24, so the charts'
#   NetworkPolicies are enforced here exactly as on k3s (kube-router). No Calico, no
#   disableDefaultCNI, no flag: one config file.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: urumi
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
