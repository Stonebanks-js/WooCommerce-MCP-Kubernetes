# Local kind cluster (make local-up). Overrides only hosts, ingress class, storage, images,
# replicas, resources and gateway.allowPrivateUpstreams (contracts section 14).
host: gateway.127.0.0.1.nip.io
publicScheme: http

ingress:
  className: traefik           # installed into namespace "traefik" by deploy/scripts/kind-up.sh
  annotations: {}
  tls: []

gateway:
  image:
    repository: urumi/gateway
    tag: dev                   # built by `make build`, sideloaded by `make load`
    pullPolicy: IfNotPresent
  replicas: 1
  allowPrivateUpstreams: true  # lets an admin register e.g. http://10.x.x.x:... upstreams while developing
  # Chat agent LLM. Any OpenAI-compatible /chat/completions endpoint works; the key comes from
  # deploy/secrets/platform.yaml (llmApiKey). Free option used for the demo: NVIDIA's hosted
  # Nemotron. Switch to provider: anthropic (+ anthropicApiKey) or provider: mock (no key) as needed.
  llm:
    provider: openai_compatible
    model: nvidia/nemotron-3-super-120b-a12b   # nemotron-3-ultra-550b-a55b also works when NVIDIA is not overloaded (503)
    baseUrl: https://integrate.api.nvidia.com/v1
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

dashboard:
  image:
    repository: urumi/dashboard
    tag: dev
    pullPolicy: IfNotPresent

postgres:
  persistence:
    storageClass: standard     # kind default (rancher local-path); data is lost with `kind delete cluster`
    size: 1Gi

mcpNotes:
  image:
    repository: urumi/extra-mcp
    tag: dev
    pullPolicy: IfNotPresent

mcpUtils:
  image:
    repository: urumi/extra-mcp
    tag: dev
    pullPolicy: IfNotPresent

networkPolicy:
  enabled: true
  ingressControllerNamespace: traefik
