{{- /*
Requirement: "no hardcoded secrets (Kubernetes Secrets only)". Every value is `required` from
.Values.secrets (deploy/secrets/platform.yaml); nothing is generated in the template, so a
`helm upgrade` can never rotate the encryption key (which would make every stored upstream
credential undecryptable) or the Postgres password behind the database's back.

Key names equal the gateway's environment variable names (contracts section 7) so the Deployment
can `envFrom` this Secret as a whole. DATABASE_URL is assembled here (password URL-encoded) so
the gateway receives the exact string it documents and the password never appears in a ConfigMap.
*/ -}}
{{- $s := .Values.secrets }}
{{- $pgPass := required "set secrets.postgresPassword (deploy/secrets/platform.yaml)" $s.postgresPassword }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-postgres
  labels:
    {{- include "platform.labels" (dict "root" . "component" "postgres") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $pgPass | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform.fullname" . }}-gateway
  labels:
    {{- include "platform.labels" (dict "root" . "component" "gateway") | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" (.Values.postgres.user | urlquery) ($pgPass | urlquery) (include "platform.fullname" .) .Values.postgres.database | quote }}
  GATEWAY_ENCRYPTION_KEY: {{ required "set secrets.encryptionKey (base64 of 32 random bytes)" $s.encryptionKey | quote }}
  SESSION_SECRET: {{ required "set secrets.sessionSecret" $s.sessionSecret | quote }}
  ADMIN_PASSWORD: {{ required "set secrets.adminPassword" $s.adminPassword | quote }}
  DEMO_MEMBER_PASSWORD: {{ $s.demoMemberPassword | default "" | quote }}
  ANTHROPIC_API_KEY: {{ $s.anthropicApiKey | default "" | quote }}
  LLM_API_KEY: {{ $s.llmApiKey | default "" | quote }}
  WOO_MCP_TOKEN: {{ required "set secrets.wooMcpToken (must equal the store chart's secrets.mcpAuthToken)" $s.wooMcpToken | quote }}
  NOTES_MCP_TOKEN: {{ if .Values.mcpNotes.enabled }}{{ required "set secrets.notesMcpToken" $s.notesMcpToken | quote }}{{ else }}{{ $s.notesMcpToken | default "" | quote }}{{ end }}
  UTILS_MCP_TOKEN: {{ if .Values.mcpUtils.enabled }}{{ required "set secrets.utilsMcpToken" $s.utilsMcpToken | quote }}{{ else }}{{ $s.utilsMcpToken | default "" | quote }}{{ end }}
