{{- /*
woo-mcp: the WooCommerce MCP server (apps/woo-mcp). Requirement: "woo-mcp not reachable from
outside the cluster" -> ClusterIP Service only (woo-mcp-service.yaml), no Ingress anywhere in this
chart, and networkpolicy.yaml admits only gateway pods. Env per contracts section 12 and
apps/woo-mcp/README.md; the two secrets come from the <release>-woo-mcp Secret.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "store.fullname" . }}-woo-mcp
  labels:
    {{- include "store.labels" (dict "root" . "component" "woo-mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.wooMcp.replicas }}
  selector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "root" . "component" "woo-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" (dict "root" . "component" "woo-mcp") | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print .Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000      # "node" user of the node:22-alpine image
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: woo-mcp
          image: {{ include "store.image" (dict "image" .Values.wooMcp.image "registry" .Values.global.imageRegistry) }}
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          env:
            - name: PORT
              value: "8080"
            - name: WOO_BASE_URL
              value: {{ include "store.wordpressInternalUrl" . | quote }}
            - name: WOO_USERNAME
              value: mcp-bot
            - name: WOO_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.fullname" . }}-woo-mcp
                  key: WOO_APP_PASSWORD
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.fullname" . }}-woo-mcp
                  key: MCP_AUTH_TOKEN
            - name: STORE_NAME
              value: {{ .Values.store.name | quote }}
            # Public storefront URL: permalinks WordPress built from the internal origin are
            # rewritten to this so tool results link somewhere a human can open.
            - name: STORE_URL
              value: {{ include "store.publicUrl" . | quote }}
            - name: WOO_TIMEOUT_MS
              value: {{ .Values.wooMcp.timeoutMs | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.wooMcp.logLevel | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # /readyz is 200 only when WordPress's /wp-json/ answers (cached 10 s), so the Service
          # stops routing to woo-mcp while the store is down; /healthz only says the process is up.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
