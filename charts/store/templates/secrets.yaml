{{- /*
Requirement: "no hardcoded secrets (Kubernetes Secrets only)". Every value below comes from
.Values.secrets and is `required`, so rendering without deploy/secrets/store.yaml fails loudly.
Nothing is generated here (no randAlphaNum): a chart-generated password would be regenerated on
every `helm upgrade` and silently diverge from what WordPress/MariaDB already have on disk.
stringData lets Kubernetes base64-encode for us, so the rendered manifest never carries a hand-rolled
encoding of a secret.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.fullname" . }}-db
  labels:
    {{- include "store.labels" (dict "root" . "component" "mariadb") | nindent 4 }}
type: Opaque
stringData:
  root-password: {{ required "set secrets.dbRootPassword (deploy/secrets/store.yaml)" .Values.secrets.dbRootPassword | quote }}
  password: {{ required "set secrets.dbPassword (deploy/secrets/store.yaml)" .Values.secrets.dbPassword | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.fullname" . }}-wordpress
  labels:
    {{- include "store.labels" (dict "root" . "component" "wordpress") | nindent 4 }}
type: Opaque
stringData:
  admin-password: {{ required "set secrets.adminPassword (deploy/secrets/store.yaml)" .Values.secrets.adminPassword | quote }}
---
{{- /*
Shared by woo-mcp (reads both) and the setup Job (installs WOO_APP_PASSWORD into WordPress).
Key names match the woo-mcp environment variable names so the Deployment can use secretKeyRef
one-to-one.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "store.fullname" . }}-woo-mcp
  labels:
    {{- include "store.labels" (dict "root" . "component" "woo-mcp") | nindent 4 }}
type: Opaque
stringData:
  MCP_AUTH_TOKEN: {{ required "set secrets.mcpAuthToken (deploy/secrets/store.yaml)" .Values.secrets.mcpAuthToken | quote }}
  {{- $app := required "set secrets.wooAppPassword (deploy/secrets/store.yaml)" .Values.secrets.wooAppPassword }}
  {{- if not (regexMatch "^[A-Za-z0-9]{24}$" $app) }}
  {{- fail "secrets.wooAppPassword must be exactly 24 alphanumeric characters (WordPress strips anything else)" }}
  {{- end }}
  WOO_APP_PASSWORD: {{ $app | quote }}
