{{- /*
MariaDB as a StatefulSet with a volumeClaimTemplate: requirement "persistent storage for the DB".
A StatefulSet (rather than a Deployment + PVC) gives a stable pod identity and keeps the claim bound
to that identity across restarts and node reschedules.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "store.fullname" . }}-mariadb
  labels:
    {{- include "store.labels" (dict "root" . "component" "mariadb") | nindent 4 }}
spec:
  serviceName: {{ include "store.fullname" . }}-mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selectorLabels" (dict "root" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" (dict "root" . "component" "mariadb") | nindent 8 }}
      annotations:
        # Roll the pod when the DB Secret changes (credentials are read at first init only, but a
        # restart surfaces a mismatch immediately instead of at the next unrelated reschedule).
        checksum/secret: {{ include (print .Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.mariadb.securityContext.runAsUser }}
        runAsGroup: {{ .Values.mariadb.securityContext.runAsGroup }}
        fsGroup: {{ .Values.mariadb.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          image: {{ include "store.image" (dict "image" .Values.mariadb.image "registry" .Values.global.imageRegistry) }}
          imagePullPolicy: {{ .Values.mariadb.image.pullPolicy }}
          # MARIADB_* names are the ones the 11.x image documents (MYSQL_* still work as aliases).
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.mariadb.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.mariadb.user | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.fullname" . }}-db
                  key: password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "store.fullname" . }}-db
                  key: root-password
            # The entrypoint creates the local, passwordless "healthcheck" user on first init (used by
            # healthcheck.sh, so no credentials appear in the probes). MARIADB_AUTO_UPGRADE=1 also
            # runs mariadb-upgrade / adds that user when the volume was created by an older image.
            - name: MARIADB_AUTO_UPGRADE
              value: "1"
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          # healthcheck.sh ships in the official image. --innodb_initialized only passes once the
          # engine finished recovery, so readiness is not reported during the (possibly long) first
          # initialisation; liveness only checks that the server accepts connections.
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.mariadb.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # Writable scratch space required with a read-only root filesystem.
            - name: run
              mountPath: /run/mysqld
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "store.selectorLabels" (dict "root" . "component" "mariadb") | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.mariadb.persistence.accessModes | nindent 10 }}
        {{- with .Values.mariadb.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mariadb.persistence.size }}
