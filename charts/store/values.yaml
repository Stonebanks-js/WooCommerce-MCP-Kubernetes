# Default values for charts/store: one WooCommerce store (WordPress + MariaDB + woo-mcp + setup Job).
#
# Assignment requirements this chart satisfies (quoted where relevant in the templates):
#   * Helm only; the same chart runs on kind (values-local.yaml) and k3s (values-prod.yaml) with
#     values changes only;
#   * everything in-cluster, persistent storage for the DB and for WordPress content;
#   * storefront exposed through an Ingress with a stable URL;
#   * readiness + liveness probes and resource requests/limits on every workload;
#   * no hardcoded secrets: every secret value is `required` from values and lands in a
#     Kubernetes Secret (deploy/secrets/store.yaml is generated by `make secrets`, git-ignored);
#   * woo-mcp is not reachable from outside the cluster: ClusterIP Service only, no Ingress, and a
#     NetworkPolicy that admits only gateway pods from `gateway.namespace`.
#
# values-local.yaml / values-prod.yaml only override: hosts, ingress class/annotations/TLS, storage
# class and sizes, image registry/tag/pullPolicy, replica counts and resources.

# Release-level naming. The in-cluster names are <release>-<component> (contracts section 2:
# demo-wordpress, demo-mariadb, demo-woo-mcp for release "demo"); set fullnameOverride to change it.
fullnameOverride: ""

global:
  # Prefix for ALL images (e.g. "ghcr.io/acme"). Empty = Docker Hub / locally loaded images.
  imageRegistry: ""

store:
  name: "Demo Store"
  host: store.127.0.0.1.nip.io
  # Public scheme used for WP_HOME / WP_SITEURL and the install URL. Switches to https
  # automatically when `ingress.tls` is non-empty, so values-prod only needs the TLS block.
  scheme: http
  currency: USD
  country: "US:CA"           # WooCommerce "country:state"
  adminUser: admin
  adminEmail: admin@example.com
  sampleProduct:
    enabled: true
    name: "Demo Mug"
    price: "12.00"

# Provided at deploy time (deploy/secrets/store.yaml, generated once by `make secrets`, never
# committed). The templates use `required`, so a missing value fails the render instead of
# silently defaulting, and nothing is generated with randAlphaNum inside the chart (a `helm
# upgrade` must never rotate credentials behind WordPress's back).
secrets:
  adminPassword: ""          # WordPress admin user password
  dbPassword: ""             # MariaDB application user password
  dbRootPassword: ""         # MariaDB root password
  mcpAuthToken: ""           # bearer the gateway must present to woo-mcp (= platform secrets.wooMcpToken)
  wooAppPassword: ""         # 24 alphanumeric chars; WordPress application password of the mcp-bot
                             # (shop_manager) user. The setup Job installs this exact value into
                             # WordPress (WP_Application_Passwords::set_user_application_passwords with
                             # WP_Application_Passwords::hash_password), so woo-mcp reads it from the same
                             # Secret. Alphanumeric only: WordPress strips other characters.

gateway:
  # Namespace of the MCP gateway release. The woo-mcp NetworkPolicy admits ingress ONLY from pods
  # labelled app.kubernetes.io/name=gateway in this namespace.
  namespace: mcp-platform

wordpress:
  image:
    repository: wordpress
    tag: 7.1.3-php8.3-apache   # pinned; never "latest"
    pullPolicy: IfNotPresent
  replicas: 1                  # RWO PVC + Recreate strategy: keep at 1 unless storage is RWX
  tablePrefix: wp_
  # Extra define() lines appended to WORDPRESS_CONFIG_EXTRA (only define()s: it is eval'd before
  # plugin.php loads). Example: "define('WP_DEBUG', false);"
  configExtra: ""
  persistence:
    size: 5Gi
    storageClass: ""           # "" = cluster default ("standard" on kind, "local-path" on k3s)
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  # securityContext exception (documented): the official wordpress:*-apache image's entrypoint starts
  # as root (to copy WordPress into the volume and write wp-config.php) and Apache's workers then run
  # as www-data (uid 33). We therefore do NOT set runAsNonRoot / runAsUser for this container; we set
  # fsGroup 33 so the PVC is group-writable by www-data and allowPrivilegeEscalation=false. Apache
  # also needs a writable /var/run and /var/lock, so readOnlyRootFilesystem is off here.
  securityContext:
    fsGroup: 33

mariadb:
  image:
    repository: mariadb
    tag: 11.8.9                # LTS, pinned
    pullPolicy: IfNotPresent
  database: wordpress
  user: wordpress
  persistence:
    size: 5Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 1Gi }
  # The official mariadb image runs as the mysql user, uid/gid 999.
  securityContext:
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999

# Setup Job (Helm post-install/post-upgrade hook): installs WordPress + WooCommerce idempotently and
# installs the deterministic application password for the mcp-bot user.
setup:
  image:
    repository: wordpress
    tag: cli-2.12.0-php8.3     # wp-cli image; shares the WordPress PVC
    pullPolicy: IfNotPresent
  woocommerceVersion: "11.2.1" # pinned plugin version downloaded from wordpress.org by the Job
  backoffLimit: 2
  activeDeadlineSeconds: 1200  # bounds the "wait for DB / WordPress" loops in the script
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }

wooMcp:
  image:
    repository: urumi/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  replicas: 1
  timeoutMs: 15000             # WOO_TIMEOUT_MS: per-request timeout for WooCommerce REST calls
  logLevel: info
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }

ingress:
  # Traefik is used both locally (installed by `make kind-up`) and on k3s (bundled). ingress-nginx was
  # retired in March 2026 and is not used. If you swap the controller for nginx anyway, the
  # annotation one would add here is:
  #   nginx.ingress.kubernetes.io/proxy-body-size: "64m"
  className: traefik
  annotations: {}
  # tls:
  #   - secretName: store-tls
  #     hosts: [store.example.com]
  tls: []

networkPolicy:
  enabled: true
  # Namespace of the ingress controller, selected via kubernetes.io/metadata.name. Traefik lives in
  # `traefik` on the local kind cluster (values-local.yaml) and in `kube-system` on k3s (values-prod.yaml).
  ingressControllerNamespace: traefik
  # Label selector for the DNS pods in kube-system (CoreDNS on kind and k3s).
  dnsPodLabels:
    k8s-app: kube-dns
  # WordPress and the setup Job may reach the internet on 80/443 (WooCommerce plugin download from
  # wordpress.org, WordPress update checks, wp-cron loopback via the public ingress on a VPS).
  internetEgress:
    enabled: true
    cidrs: ["0.0.0.0/0"]

# ResourceQuota + LimitRange for the namespace (used for provisioned stores to cap what one tenant can
# consume). Off by default so the demo is not constrained by accident; values-prod enables it.
quota:
  enabled: false
  requests: { cpu: "2", memory: 4Gi }
  limits: { cpu: "4", memory: 8Gi }
  pods: "20"
  persistentVolumeClaims: "5"
  limitRange:
    defaultRequest: { cpu: 50m, memory: 64Mi }
    default: { cpu: 500m, memory: 512Mi }
